<div class="min-h-screen bg-[#f0fdf4] font-display text-slate-800 p-4 sm:p-6 lg:p-10">

  <div class="max-w-5xl mx-auto space-y-6 sm:space-y-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 sm:gap-6">
      <div class="flex items-center gap-3 sm:gap-5 w-full md:w-auto">
        <button (click)="goBack()" class="size-9 sm:size-11 flex-none flex items-center justify-center rounded-full bg-white border border-emerald-100 text-slate-400 hover:text-emerald-500 shadow-sm transition-all">
          <span translate="no" class="material-symbols-outlined notranslate font-bold text-[20px] sm:text-[24px]">arrow_back</span>
        </button>
        <div class="min-w-0">
          <h1 class="text-xl sm:text-3xl font-black uppercase tracking-tight text-emerald-900 truncate">My <span class="text-emerald-500">Attendance</span></h1>
          <p class="text-slate-400 text-[10px] sm:text-xs font-bold uppercase tracking-widest mt-0.5 sm:mt-1 truncate">Presence Log</p>
        </div>
      </div>

      <div class="flex flex-wrap gap-2 sm:gap-3 w-full md:w-auto">
        <div class="flex-1 md:flex-none text-center px-3 sm:px-4 py-2 bg-green-100 text-green-700 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-wide whitespace-nowrap">Present: {{presentPercentage}}%</div>
        <div class="flex-1 md:flex-none text-center px-3 sm:px-4 py-2 bg-red-100 text-red-700 rounded-lg sm:rounded-xl text-[10px] sm:text-xs font-black uppercase tracking-wide whitespace-nowrap">Absent: {{absentCount}} Days</div>
      </div>
    </div>

    <div *ngIf="attendanceRecords.length === 0" class="bg-white rounded-[2rem] sm:rounded-[2.5rem] border border-emerald-100 shadow-sm flex flex-col items-center justify-center h-48 sm:h-64 animate-fade-in mx-1 sm:mx-0">
      <span translate="no" class="material-symbols-outlined notranslate text-5xl sm:text-6xl text-emerald-100 mb-3 sm:mb-4">calendar_today</span>
      <p class="text-xs sm:text-sm font-black uppercase tracking-widest text-slate-400">No Attendance Logs Found.</p>
    </div>

    <div *ngIf="attendanceRecords.length > 0" class="bg-white rounded-[1.5rem] sm:rounded-[2.5rem] border border-emerald-100 overflow-hidden shadow-xl shadow-emerald-500/5 animate-fade-in w-full overflow-x-auto">
      <div class="grid grid-cols-1 divide-y divide-emerald-50 min-w-[500px] w-full">
        <div *ngFor="let r of attendanceRecords" class="p-4 sm:p-6 flex items-center justify-between hover:bg-emerald-50/20 transition-colors">
          <div class="flex items-center gap-3 sm:gap-4 min-w-0 pr-4">

            <div class="size-10 sm:size-12 shrink-0 rounded-xl sm:rounded-2xl flex items-center justify-center text-lg sm:text-xl font-bold bg-slate-50 text-slate-400 border border-slate-100">
              {{r.date.split('-')[2]}}
            </div>

            <div class="min-w-0">
              <h4 class="font-bold text-slate-800 text-xs sm:text-sm truncate">{{r.subject}}</h4>
              <p class="text-[9px] sm:text-xs text-slate-400 font-bold uppercase truncate">{{r.date}}</p>
            </div>
          </div>
          <div class="flex items-center gap-3 sm:gap-6 shrink-0 pl-2 border-l border-emerald-50 sm:border-none">
            <span class="text-xs sm:text-sm font-mono font-bold text-slate-500 whitespace-nowrap">{{r.time}}</span>
            <span [ngClass]="{'bg-green-100 text-green-700': r.status === 'Present', 'bg-red-100 text-red-700': r.status === 'Absent', 'bg-orange-100 text-orange-700': r.status === 'Late'}"
                  class="px-2.5 sm:px-4 py-1 sm:py-1.5 rounded-md sm:rounded-lg text-[9px] sm:text-[10px] font-black uppercase min-w-[60px] sm:min-w-[80px] text-center inline-block">
              {{r.status}}
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="h-24 md:h-32 w-full shrink-0"></div>

  </div>
</div>
