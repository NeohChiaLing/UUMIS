<div class="flex flex-col h-screen bg-[#f8fcfa] font-display text-[#0e1b13] overflow-hidden relative">

  <div *ngIf="showPreviewModal" class="fixed inset-0 z-[120] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 sm:p-6 animate-fade-in" (click)="closePreview()">
    <div class="bg-transparent w-full max-w-4xl h-[70vh] sm:h-[85vh] flex flex-col items-center justify-center relative mt-8 sm:mt-0" (click)="$event.stopPropagation()">

      <button (click)="closePreview()" class="absolute -top-10 sm:-top-12 right-0 text-white hover:text-gray-300 transition-colors flex items-center gap-1 sm:gap-2 bg-black/50 sm:bg-transparent px-3 py-1 sm:p-0 rounded-full sm:rounded-none">
        <span class="text-xs sm:text-sm font-bold uppercase tracking-widest">Close Preview</span>
        <span translate="no" class="material-symbols-outlined notranslate text-2xl sm:text-3xl">close</span>
      </button>

      <div class="w-full h-full bg-white rounded-xl overflow-hidden shadow-2xl flex items-center justify-center">
        <img *ngIf="previewType === 'image'" [src]="previewContent" class="w-full h-full object-contain">
        <iframe *ngIf="previewType === 'pdf'" [src]="previewContent" class="w-full h-full border-none"></iframe>
      </div>
    </div>
  </div>

  <div class="flex-1 flex flex-col h-full overflow-hidden relative">

    <header class="h-auto md:h-24 py-4 md:py-0 shrink-0 border-b border-[#e7f3ec] bg-white/80 backdrop-blur-md px-4 sm:px-6 lg:px-10 flex items-center gap-3 sm:gap-5 z-10 sticky top-0">
      <button (click)="goBack()" class="size-8 sm:size-10 flex-none flex items-center justify-center rounded-full bg-white border border-gray-200 text-gray-500 hover:bg-emerald-50 hover:text-emerald-600 hover:border-emerald-200 transition-all shadow-sm shrink-0">
        <span translate="no" class="material-symbols-outlined notranslate text-[18px] sm:text-xl">arrow_back</span>
      </button>
      <div class="min-w-0">
        <h1 class="text-xl sm:text-2xl lg:text-3xl font-black text-[#0e1b13] tracking-tight truncate">Discount & Promotions</h1>
        <p class="text-xs sm:text-sm text-[#4e976b] font-medium mt-0.5 sm:mt-1 truncate">Exclusive benefits and offers for you.</p>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-10 relative">

      <div *ngIf="activeDiscounts.length === 0" class="h-[60vh] md:h-96 flex flex-col items-center justify-center border-2 md:border-3 border-dashed border-gray-200 rounded-[2rem] md:rounded-[3rem] bg-gray-50/50 text-gray-400 p-6 text-center max-w-2xl mx-auto mt-4">
        <span translate="no" class="material-symbols-outlined notranslate text-5xl md:text-6xl mb-3 md:mb-4 opacity-50">sell</span>
        <p class="text-base md:text-lg font-bold">No discounts available right now.</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6 sm:gap-8">

        <div *ngFor="let item of activeDiscounts" class="bg-white rounded-[2rem] md:rounded-[2.5rem] border border-[#e7f3ec] shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col group relative">

          <div class="h-56 sm:h-64 md:h-[350px] lg:h-[400px] w-full bg-gray-100 relative overflow-hidden flex items-center justify-center">

            <img *ngIf="item.fileType === 'image' && item.fileUrl" [src]="item.fileUrl" alt="Discount Cover" class="w-full h-full object-cover sm:object-contain p-0 sm:p-2 transition-transform duration-500 group-hover:scale-105">

            <div *ngIf="item.fileType === 'pdf'" class="w-full h-full flex flex-col items-center justify-center bg-red-50 text-red-400 group-hover:bg-red-100 transition-colors p-4">
              <span translate="no" class="material-symbols-outlined notranslate text-6xl md:text-8xl">picture_as_pdf</span>
              <p class="text-xs md:text-sm font-bold mt-2 md:mt-4 uppercase tracking-wider text-center">PDF Document</p>
            </div>

            <div class="absolute top-4 right-4 md:top-5 md:right-5 px-3 py-1.5 md:px-4 md:py-2 rounded-full text-[9px] md:text-[11px] font-black uppercase tracking-widest shadow-sm backdrop-blur-md bg-emerald-500/90 text-white">
              {{ item.status }}
            </div>
          </div>

          <div class="p-5 md:p-8 flex flex-col flex-1 border-t border-gray-100">

            <div class="flex items-center gap-1.5 md:gap-2 mb-3 md:mb-4 flex-wrap">
              <span translate="no" class="material-symbols-outlined notranslate text-emerald-500 text-base md:text-lg shrink-0">date_range</span>
              <p class="text-[10px] md:text-xs font-bold text-emerald-700 bg-emerald-50 px-2 md:px-3 py-1 md:py-1.5 rounded-lg font-mono flex items-center flex-wrap break-words">
                <span class="whitespace-nowrap">{{ item.startDate }}</span>
                <span class="text-emerald-300 mx-1">to</span>
                <span class="whitespace-nowrap">{{ item.endDate }}</span>
              </p>
            </div>

            <h3 class="text-lg md:text-xl font-black text-[#0e1b13] leading-tight mb-2 md:mb-3 line-clamp-2">{{ item.title }}</h3>
            <p class="text-xs md:text-sm text-gray-500 font-medium leading-relaxed mb-6 md:mb-8 flex-1 line-clamp-3 md:line-clamp-4">
              {{ item.description || 'No description provided.' }}
            </p>

            <div class="flex flex-col sm:flex-row sm:items-center justify-between pt-4 md:pt-6 border-t border-gray-100 gap-3 sm:gap-0">

              <span class="text-[9px] md:text-[10px] font-black uppercase tracking-widest text-gray-400 text-center sm:text-left">Actions</span>

              <div class="flex flex-wrap sm:flex-nowrap items-center justify-center sm:justify-end gap-2 md:gap-3 w-full sm:w-auto">
                <button (click)="openPreview(item)" [class.opacity-50]="!item.fileUrl" class="flex-1 sm:flex-none h-9 md:h-10 px-3 md:px-5 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-500 hover:text-white transition-all shadow-sm flex items-center justify-center gap-1.5 md:gap-2 font-bold text-[10px] md:text-xs uppercase tracking-wide whitespace-nowrap" title="Preview">
                  <span translate="no" class="material-symbols-outlined notranslate text-[16px] md:text-[18px]">visibility</span> View
                </button>

                <button (click)="downloadFlyer(item)" [class.opacity-50]="!item.fileUrl" class="flex-1 sm:flex-none h-9 md:h-10 px-3 md:px-5 rounded-full bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white transition-all shadow-sm flex items-center justify-center gap-1.5 md:gap-2 font-bold text-[10px] md:text-xs uppercase tracking-wide whitespace-nowrap" title="Download">
                  <span translate="no" class="material-symbols-outlined notranslate text-[16px] md:text-[18px]">download</span> Save
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>

      <div class="h-24 md:h-32 w-full shrink-0"></div>
    </div>
  </div>
</div>
